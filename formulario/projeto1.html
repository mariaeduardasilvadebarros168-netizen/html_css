<form>
    <h1>Matricula - Escola Online</h1>
  <fieldset>
    <legend>Dados pessoais</legend>
    <label for="nome">Nome completo:</label>
    <input type="text" id="nome" name="nome">
    <br>
    <br>
    <label for="nascimento">Data de nascimento:</label>
<input type="date" id="nascimento" name="nascimento">
<br>
<br>
<label for="email">E-mail do aluno:</label>
<input type="email" id="email" name="email" placeholder="aluno@exemplo.com">
<br>
<br>
<label for="senha">senha de acesso:</label>
<input type="senha" id="senha" name="senha" placeholder="********">
<br>
<br>
<label for="telefone">telefone de emergência:</label>
<input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
<br>
<br>
  </fieldset>


  
 <fieldset>
    <legend>Preferencia do aluno</legend>
  <p>area Interesses:</p>
<input type="checkbox" id="Frond-end" name="interesses" value="Frond-end">
<label for="Frond-end">Frond-end</label>
<br>
<br>
<input type="checkbox" id="Back-end" name="interesses" value="Back-end">
<label for="Back-end">Back-end</label>
<br>
<br>
<input type="checkbox" id="Design" name="interesses" value="Design">
<label for="Design">Design</label>
<br>
<br>
<input type="checkbox" id="Dados" name="interesses" value="Dados">
<label for="Dados">Dados</label>
<br>
<br>
<label for="escola">Como conheceu a escola:</label>
<select id="estado" name="estado">
  <option value="">Indicação</option>
  <option value="sp">Amigos e familiares</option>
  <option value="rj">Redes sociais</option>
  <option value="mg">pesquisas</option>
</select>
</fieldset>


<button type="submit">Matricular</button>
<button type="reset">Limpar</button>
