<form>
    <h1>Finalizar Compra</h1>
    <fieldset>
        <legend>endereço de entrega</legend>
    <label for="nome">Nome do Destinatario:</label>
    <input type="text"id ="nome" name="nome">
    <br>
    <br>
    <label for="cep">CEP:</label>
    <input type="text"id="cep" name="cep" placeholder="0000-00">
    <br>
    <br>
    <label for="rua">Rua:</label>
    <input type="text" id="rua" name="rua">
    <br>
    <br>
    <label for="numero">Número:</label>
    <input type="text" id="numero" name="numero">
    <br>
    <br>
    <label for="complemento">Complemento:</label>
    <input type="text" id="complemento" name="complemento">
    </fieldset>

    <fieldset>
        <legend>Opeções de entrega</legend>
        <label for="entrega">Perído de Entrega</label>
        <select id="opeções" name="opeções">
        <option value="manhã">manhã (08h-12h)</option>
        <option value="tarde">tarde (14h-17h)</option>
        <option value="noite">noite (18h-22h)</option>
        </select>
        <br>
        <br>
        <p>Instrução de Entrega</p>
        <input type="checkbox" id="Deixar na portaria" name="entrega" value="Deixar na portaria">
        <label for="Deixar na portaria">Deixar na portaria</label>
        <br>
        <input type="checkbox" id="Entregar em mãos" name="entrega" value="Entrega em mãos">
        <label for="Entrega em mãos">Entregar em mãos</label>
        <br>
        <input type="checkbox" id="Ligar quando chegar" name="entrega" value="Ligar quando chegar">
        <label for="Ligar quando chegar">Ligar quando chegar</label>
        <br>
        <br>
        <label for="desconto">Cupom de desconto:</label>
        <input type="text" id="desconto" name="desconto">
        <br>
        <br>
        <input type="checkbox" id="Receber oferta por Whatsapp" name="receber" value="Receber oferta por Whatsapp">
        <label for="Receber oferta por Whatsapp">Receber oferta por Whatsapp</label>
    </fieldset>

    <button type="submit">Finalizar compra</button>
</form>
